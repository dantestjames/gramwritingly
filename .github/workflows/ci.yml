name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core
        run: pnpm --filter @gramwritingly/core build
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Test
        run: pnpm -r run test
      - name: Build web and extension
        run: |
          pnpm --filter @gramwritingly/web build
          pnpm --filter @gramwritingly/extension package
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: apps/extension/artifacts/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
